<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
  <style>
    .background { fill: #f0f4f8; }
    .primary-accent { fill: #007bff; }
    .secondary-accent { fill: #6c757d; }
    .icon-fill { fill: #ffffff; }
    .text-color { fill: #343a40; }
    .shadow { fill: rgba(0,0,0,0.1); }
  </style>

  <!-- Background -->
  <rect class="background" width="800" height="600"/>

  <!-- Central Concept: AI Style Transfer -->
  <g transform="translate(400, 300) scale(1.2)">
    <circle cx="0" cy="0" r="100" class="primary-accent"/>
    <circle cx="0" cy="0" r="80" class="background"/>

    <!-- AI Brain Icon -->
    <g transform="translate(-50, -50)">
      <path d="M50 50 C 60 30 80 20 100 20 C 120 20 140 30 150 50 C 140 70 120 80 100 80 C 80 80 60 70 50 50 Z" class="primary-accent"/>
      <path d="M60 40 C 70 35 85 35 95 40 C 90 45 70 45 60 40 Z" class="secondary-accent"/>
      <path d="M105 40 C 115 35 130 35 140 40 C 135 45 115 45 105 40 Z" class="secondary-accent"/>
      <path d="M70 60 C 75 55 85 55 90 60 C 85 65 75 65 70 60 Z" class="secondary-accent"/>
      <path d="M95 60 C 100 55 110 55 115 60 C 110 65 100 65 95 60 Z" class="secondary-accent"/>
    </g>

    <!-- Arrow representing transfer/processing -->
    <path d="M 120 0 L 150 0 L 135 -20 Z" class="primary-accent" transform="rotate(-30)"/>
    <line x1="100" y1="0" x2="130" y2="0" stroke="#ffffff" stroke-width="8" transform="rotate(-30)"/>
  </g>

  <!-- Left Side: Indie Game Dev Element -->
  <g transform="translate(150, 300) scale(0.8)">
    <rect x="0" y="0" width="150" height="100" rx="10" ry="10" class="secondary-accent"/>
    <text x="75" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" class="icon-fill">Game</text>
    <path d="M50 80 L100 80 L75 120 Z" class="icon-fill"/>
  </g>

  <!-- Right Side: Niche Generative Art Element -->
  <g transform="translate(650, 300) scale(0.8)">
    <rect x="0" y="0" width="150" height="100" rx="10" ry="10" class="primary-accent"/>
    <path d="M 25 40 L 75 40 L 75 70 L 25 70 Z" class="icon-fill"/>
    <path d="M 75 40 L 125 40 L 125 70 L 75 70 Z" class="icon-fill"/>
    <circle cx="100" cy="55" r="15" class="background"/>
    <text x="75" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" class="icon-fill">Art</text>
  </g>

  <!-- Title Text -->
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" class="text-color">AI-Powered Niche</text>
  <text x="400" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" class="secondary-accent">Generative Art Style Transfer</text>
  <text x="400" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" class="primary-accent">for Indie Game Devs</text>

</svg>